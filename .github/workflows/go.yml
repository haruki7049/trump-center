name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Ebitengine dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config xvfb
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum go test ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...
